# Publishes the package to nuget.org when a version tag such as v1.0.0 is pushed.
# Requires a repository secret named NUGET_API_KEY. Nothing runs until both exist.
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The tag is the single source of truth for the version: v1.2.0 becomes package version 1.2.0.
      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet test --configuration Release
      - run: dotnet pack src/BasicTools.Mediator --configuration Release --output artifacts -p:Version=$VERSION

      # Pushing the .nupkg also pushes the matching .snupkg symbols package.
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
