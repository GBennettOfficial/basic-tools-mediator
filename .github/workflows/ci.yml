# Builds, tests and packs on every push to main and every pull request.
# The package is uploaded as a build artifact so it can be inspected, but nothing is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack src/BasicTools.Mediator --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
